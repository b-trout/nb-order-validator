# .pre-commit-config.yaml
repos:
  # 1. Basica File Check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. Mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [ijson, types-setuptools, pytest]
        args: ["--scripts-are-modules", "--config-file=pyproject.toml"]

  # 3. Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
